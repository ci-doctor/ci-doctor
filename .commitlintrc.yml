# Self-contained on purpose: mise installs the CLI in isolation, so `extends:
# '@commitlint/config-conventional'` would not resolve. CI checks PR titles with a regex in conventions.yml;
# keep type-enum in step with its TYPES.
# The release workflow reads the type to decide whether to ship the next alpha.
# The bare parser does not know `type!:` (breaking change), so the header is spelled out.
parserPreset:
  parserOpts:
    headerPattern: '^(\w*)(?:\((.*)\))?!?: (.*)$'
    breakingHeaderPattern: '^(\w*)(?:\((.*)\))?!: (.*)$'
    headerCorrespondence: [type, scope, subject]
rules:
  type-enum:
    - 2
    - always
    - [feat, fix, docs, test, chore, refactor, perf, ci, build, style, revert]
  type-case: [2, always, lower-case]
  type-empty: [2, never]
  scope-case: [2, always, lower-case]
  subject-empty: [2, never]
  header-max-length: [2, always, 72]
