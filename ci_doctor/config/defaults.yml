# yaml-language-server: $schema=https://github.com/fennet82/ci-doctor/releases/latest/download/ci-doctor.schema.json

# Shipped baseline config.
#
# Scalar defaults live in schema.py; this file carries the data-heavy baseline
# (phase map, starter matchers, noise patterns) that is awkward to express as
# Python defaults. Layer order (lowest -> highest precedence):
#   schema defaults  <  this file  <  repo .ci-doctor.yml  <  CI_DOCTOR_* env  <  CLI flags
# List values REPLACE across layers; mappings deep-merge.

# GitLab section name -> phase. Users add their own custom sections under `phases:`
# in the repo config (deep-merged onto this map).
phases:
  resolve_secrets: prepare
  prepare_executor: prepare
  prepare_script: prepare
  get_sources: fetch
  restore_cache: fetch
  download_artifacts: fetch
  step_script: script
  after_script: post
  archive_cache: post
  archive_cache_on_failure: post
  upload_artifacts_on_success: post
  upload_artifacts_on_failure: post
  cleanup_file_variables: post
  # GitHub Actions canonical section names (emitted by the GitHub segmenter).
  setup_job: prepare
  setup: prepare
  checkout: fetch
  run: script
  post: post
  complete_job: post

extraction:
  # Evidence windows, shed under budget by (role, position) — see GUIDELINES §5.1.
  # `description` is prompt text: say what the tool is and what its failure means.
  matchers:
    # --- Python ------------------------------------------------------------
    - id: pytest
      role: tool
      classification: [python, test]
      description: >-
        pytest's `=== FAILURES ===` block, from the first failing test through to the short summary.
      start: '^=+ FAILURES =+'
      end: '^=+ short test summary'
      examples:
        match: ['=================================== FAILURES ===================================']
        no_match: ['=========================== short test summary info ============================']
    # `after` is large: the exception type sits at the *bottom* of a traceback.
    - id: python_traceback
      role: tool
      classification: [python, runtime]
      description: >-
        An uncaught Python exception. The exception type and message are on the traceback's last line; the frames above show where it was raised.
      pattern: '^\s*Traceback \(most recent call last\):'
      before: 1
      after: 25
      examples:
        match: ['Traceback (most recent call last):']
        no_match: ['  File "etl/transform.py", line 88, in apply']
    - id: python_lint
      role: tool
      classification: [python, lint]
      description: >-
        A `file.py:12: error` diagnostic from mypy, ruff, flake8 or pylint.
      pattern: '^\S+\.py:\d+:(\d+:)? (error|[EFWCN]\d+)'
      after: 3
      examples:
        match: ['etl/transform.py:88: error: Unsupported operand types for / ("Decimal" and "None")  [operator]']
        no_match: ['etl/transform.py:88: note: Revealed type is "Decimal"']

    # --- JavaScript / TypeScript ---------------------------------------------
    # The JS filename keeps `^FAIL` off `go test`'s own `FAIL pkg 0.03s` line.
    - id: jest
      role: tool
      classification: [js, test]
      description: >-
        A jest test failure — the `●` header names the test, and the diff below it shows expected against received.
      start: '^\s*●|^FAIL\s+\S+\.(test|spec)\.[jt]sx?\b'
      end: '^Tests:'
      examples:
        match: ['FAIL  src/cart/discount.test.ts']
        no_match: ["FAIL\texample.com/reconcile\t0.038s"]
    - id: tsc
      role: tool
      classification: [js, build]
      description: >-
        A TypeScript compile error (`error TS2345:`) with the source excerpt around it.
      pattern: 'error TS\d+:'
      before: 1
      after: 3
      examples:
        match: ["src/services/report.ts:88:23 - error TS2345: Argument of type 'string | undefined' is not assignable"]
        no_match: ['Found 2 errors in the same file, starting at: src/services/report.ts:88']
    - id: eslint
      role: tool
      classification: [js, lint]
      description: >-
        ESLint's `line:col error rule-name` entries and its `✖ N problems` footer.
      pattern: '^\s*\d+:\d+\s+error\s+|✖ \d+ problems?'
      before: 2
      after: 6
      examples:
        match: ["   14:9   error    'discount' is assigned a value but never used  no-unused-vars"]
        no_match: ['   3:1   warning  Unexpected console statement  no-console']
    - id: pnpm
      role: tool
      classification: [js, deps]
      description: >-
        pnpm's `ERR_PNPM_*` codes — the resolver or lockfile refusing, which is the cause itself.
      pattern: 'ERR_PNPM_\w+'
      before: 1
      after: 10
      examples:
        match: [' ERR_PNPM_OUTDATED_LOCKFILE  Cannot install with "frozen-lockfile" because pnpm-lock.yaml is not up to date']
        no_match: [' WARN  deprecated inflight@1.0.6']
    - id: yarn
      role: tool
      classification: [js, deps]
      description: >-
        Yarn Classic's `error <Capital>` lines and Berry's `➤ YN####:` diagnostic codes.
      pattern: '^error [A-Z]|➤ YN\d{4}'
      before: 1
      after: 8
      examples:
        match: ['error Couldn''t find package "@acme/design-tokens@^3.1.0" required by "web@1.0.0" on the "npm" registry.']
        no_match: ['error: expect(received).toBe(expected)']
    # Anchors on `✗` too: the `N fail` summary trails the assertion detail.
    - id: bun
      role: tool
      classification: [js, test, deps]
      description: >-
        A failed `bun test` (the `✗` test and its assertion), or a `bun install` that found no matching version.
      pattern: 'error: No version matching|^\s*✗ |^\s*\d+ fail\b'
      before: 2
      after: 12
      examples:
        match: ['✗ Cart > applies the loyalty discount before tax']
        no_match: ['✓ Cart > adds an item to the cart [0.42ms]']
    # `before` is large: the message sits *above* the stack.
    - id: node_runtime
      role: tool
      classification: [js, runtime]
      description: >-
        An uncaught Node error. The message above the stack is the cause; an ESM/CJS resolution error means a missing or mis-declared module.
      pattern: '^\s*at .+\(node:internal|^Node\.js v\d+\.|ERR_MODULE_NOT_FOUND|ERR_REQUIRE_ESM|UnhandledPromiseRejection'
      before: 12
      after: 6
      examples:
        match: ['    at Module._compile (node:internal/modules/cjs/loader:1356:14)']
        no_match: ['    at Object.<anonymous> (/builds/team/api/src/server.js:12:9)']
    - id: playwright
      role: tool
      classification: [js, e2e]
      description: >-
        A Playwright test failure — the `1) suite › test` header names the test; its trace and diff follow.
      pattern: '^\s*\d+\) .+ › '
      after: 20
      examples:
        match: ['  1) [chromium] › tests/checkout.spec.ts:24:1 › applies a promo code ═══════════']
        no_match: ['  1 failed']
    - id: cypress
      role: tool
      classification: [js, e2e]
      description: >-
        A `CypressError` or a retry timeout, with the command log leading up to it.
      pattern: 'CypressError|Timed out retrying after \d+ms'
      before: 3
      after: 12
      examples:
        match: ["     AssertionError: Timed out retrying after 4000ms: expected '<span>' to have text '$27.00'"]
        no_match: ['  Running:  checkout.cy.ts                                                  (1 of 1)']
    - id: npm
      role: wrapper
      classification: [js, deps]
      description: >-
        `npm ERR!` lines. A wrapper: npm reports the failure of the script it ran, never the cause.
      pattern: 'npm ERR!'
      before: 2
      after: 10
      examples:
        match: ['npm ERR! Lifecycle script `build` failed with error:']
        no_match: ['npm WARN deprecated rimraf@3.0.2']
    - id: js_script_exit
      role: wrapper
      classification: [js]
      description: >-
        A JS package manager announcing that a lifecycle script exited non-zero — pnpm's `ELIFECYCLE`, bun's `error: script "x" exited with code N`.
      pattern: '^\s*ELIFECYCLE\b|error: script ".+" exited with code'
      before: 1
      after: 4
      examples:
        match: ['error: script "test" exited with code 1']
        no_match: ['error: expect(received).toBe(expected)']

    # --- Go ----------------------------------------------------------------
    - id: go_test
      role: tool
      classification: [go, test]
      description: >-
        `go test`'s per-test `--- FAIL` marker, plus the assertion output printed under it.
      pattern: '^--- FAIL'
      before: 2
      after: 15
      examples:
        match: ['--- FAIL: TestReconcile_DetectsDrift (0.00s)']
        no_match: ['--- PASS: TestReconcile_Empty (0.00s)']
    - id: go_panic
      role: tool
      classification: [go, runtime]
      description: >-
        A Go `panic:` or runtime `fatal error:` with the goroutine dump beneath it.
      pattern: '^panic: |^fatal error: '
      before: 2
      after: 20
      examples:
        match: ['panic: runtime error: index out of range [512] with length 512']
        no_match: ['c++: fatal error: Killed signal terminated program cc1plus']

    # --- Rust (cargo) ------------------------------------------------------
    - id: rust_test
      role: tool
      classification: [rust, test]
      description: >-
        `cargo test`'s `failures:` block through to the `test result:` line.
      start: '^failures:$'
      end: '^test result:'
      examples:
        match: ['failures:']
        no_match: ['    posting::tests::applies_fx_rate']
    - id: rust_panic
      role: tool
      classification: [rust, runtime]
      description: >-
        A Rust panic, with the message and the frames that follow it.
      pattern: '^thread ''.*'' panicked at'
      before: 2
      after: 8
      examples:
        match: ["thread 'posting::tests::applies_fx_rate' panicked at src/posting.rs:212:9:"]
        no_match: ['note: run with `RUST_BACKTRACE=1` environment variable to display a backtrace']
    # A bare `^error:` is not rust enough — bun prints `error: expect(...)`.
    - id: rust_compile
      role: tool
      classification: [rust, build]
      description: >-
        rustc refusing to compile (`error[E0308]`). The first error is usually the cause; later ones often follow from it.
      pattern: '^error\[E\d+\]: |^error: (could not compile|aborting due to|linking with)'
      after: 8
      examples:
        match: ['error[E0308]: mismatched types']
        no_match: ['error: expect(received).toBe(expected)']

    # --- JVM (Maven / Gradle) ----------------------------------------------
    - id: maven_gradle
      role: tool
      classification: [jvm, build]
      description: >-
        Maven's `[ERROR]` lines — the compiler and test diagnostics Maven relays.
      pattern: '\[ERROR\]'
      before: 3
      after: 15
      examples:
        match: ['[ERROR] /builds/team/ledger/src/main/java/com/acme/ledger/PostingService.java:[62,38] incompatible types']
        no_match: ['[INFO] BUILD FAILURE']
    - id: gradle
      role: wrapper
      classification: [jvm, build]
      description: >-
        Gradle's `* What went wrong:` block, stopping before the `* Try:` boilerplate advice. A wrapper — it names the failed task, the compiler output above it is the cause.
      start: '^\* What went wrong:'
      end: '^\* (Try|Get more help)'
      examples:
        match: ['* What went wrong:']
        no_match: ['* Try:']
    - id: build_failure_banner
      role: wrapper
      classification: [jvm, build]
      description: >-
        The `BUILD FAILURE` / `FAILURE: Build failed` banner Maven and Gradle print once the build gave up.
      pattern: 'FAILURE: Build failed|BUILD FAILURE'
      before: 3
      after: 15
      examples:
        match: ['[INFO] BUILD FAILURE', 'FAILURE: Build failed with an exception.']
        no_match: ['[INFO] BUILD SUCCESS']

    # --- .NET (dotnet build / dotnet test) -----------------------------------
    - id: dotnet_test
      role: tool
      classification: [dotnet, test]
      description: >-
        `dotnet test`: xunit/nunit `[FAIL]` markers and the `Failed!` summary line.
      pattern: '\[FAIL\]|^\s*Failed\s+\S+\s+\[\d|^Failed!\s+-\s+Failed:'
      before: 1
      after: 12
      examples:
        match: ['[xUnit.net 00:00:01.42]     Billing.Tests.InvoiceTests.AppliesVatToNetTotal [FAIL]']
        no_match: ['  Passed Billing.Tests.InvoiceTests.RoundsHalfUp [12 ms]']
    - id: dotnet_build
      role: tool
      classification: [dotnet, build]
      description: >-
        MSBuild, Roslyn and NuGet error codes — `error CS0103`, `error NU1101`, `error MSB3073`.
      pattern: 'error (CS|MSB|NU|AD)\d+'
      before: 1
      after: 3
      examples:
        match: ["/builds/team/billing/src/Billing/InvoiceService.cs(112,31): error CS1061: 'Invoice' does not contain a definition"]
        no_match: ['/builds/team/billing/src/Billing/InvoiceService.cs(40,17): warning CS8618: Non-nullable property']

    # --- Ruby (rspec / minitest / bundler) ---------------------------------
    - id: rspec
      role: tool
      classification: [ruby, test]
      description: >-
        RSpec's `Failures:` block through to the `N examples, N failures` tally.
      start: '^Failures:$'
      end: '^\d+ examples?, \d+ failures?'
      examples:
        match: ['Failures:']
        no_match: ['Failures: 1']
    - id: minitest
      role: tool
      classification: [ruby, test]
      description: >-
        Minitest's numbered `1) Failure:` entries and the assertion beneath each one.
      pattern: '^\s*\d+\) (Failure|Error):'
      after: 10
      examples:
        match: ['  1) Failure:']
        no_match: ['3 runs, 3 assertions, 1 failures, 0 errors, 0 skips']
    - id: ruby_exception
      role: tool
      classification: [ruby, runtime]
      description: >-
        An unhandled Ruby exception — a backtrace frame naming the error class.
      pattern: '\.rb:\d+:in .+\(\w*(Error|Exception)\)'
      before: 2
      after: 10
      examples:
        match: ["/builds/team/shop/db/migrate/20240612093000_add_loyalty.rb:8:in `up': undefined method `default_tier' for nil (NoMethodError)"]
        no_match: ["/builds/team/shop/db/migrate/20240612093000_add_loyalty.rb:8:in `up'"]
    - id: bundler
      role: tool
      classification: [ruby, deps]
      description: >-
        Bundler failing to resolve — a missing gem, or a version conflict it prints the tree for.
      pattern: 'Could not find gem|Bundler::(GemNotFound|VersionConflict)'
      before: 1
      after: 6
      examples:
        match: ["Could not find gem 'sidekiq-pro (~> 7.2)' in rubygems repository https://rubygems.org/ or installed locally."]
        no_match: ['Bundle complete! 42 Gemfile dependencies, 118 gems now installed.']

    # --- PHP (phpunit / composer) ------------------------------------------
    - id: phpunit
      role: tool
      classification: [php, test]
      description: >-
        PHPUnit's `There were N failures` block through to its `FAILURES`/`ERRORS`/`OK` footer.
      start: '^There (was|were) \d+ (failure|error)'
      end: '^(FAILURES|ERRORS|OK)'
      examples:
        match: ['There was 1 failure:']
        no_match: ['OK (12 tests, 30 assertions)']
    - id: php_fatal
      role: tool
      classification: [php, runtime]
      description: >-
        A PHP fatal or parse error and the stack trace after it.
      pattern: 'PHP (Fatal|Parse) error|^Fatal error:'
      before: 1
      after: 8
      examples:
        match: ['PHP Fatal error:  Uncaught TypeError: App\Pricing\VatCalculator::__construct(): Argument #1 ($rate) must be of type float']
        no_match: ['PHP Warning:  Undefined array key "rate" in /app/src/Pricing.php on line 12']
    - id: composer
      role: tool
      classification: [php, deps]
      description: >-
        Composer's resolver refusing the requirements, with the explanation it prints underneath.
      pattern: 'Your requirements could not be resolved'
      before: 1
      after: 12
      examples:
        match: ['Your requirements could not be resolved to an installable set of packages.']
        no_match: ['Package operations: 12 installs, 0 updates, 0 removals']

    # --- C / C++ -----------------------------------------------------------
    - id: cc_cpp
      role: tool
      classification: [c, build]
      description: >-
        C/C++ builds — CMake configure errors and linker `undefined reference` / `collect2` failures.
      pattern: 'CMake Error|undefined reference to|collect2: error'
      before: 3
      after: 8
      examples:
        match: ["render.cpp:(.text+0x2f1): undefined reference to `Pipeline::flush()'"]
        no_match: ['make[2]: *** [CMakeFiles/render.dir/build.make:97: render] Error 1']

    # --- Language-agnostic build drivers -------------------------------------
    - id: make
      role: wrapper
      classification: [any, build]
      description: >-
        `make: ***` — make reporting that a recipe it ran failed. The recipe's own output above it is the cause.
      pattern: 'make(\[\d+\])?: \*\*\* '
      before: 3
      after: 8
      examples:
        match: ['make[2]: *** [CMakeFiles/render.dir/build.make:97: render] Error 1']
        no_match: ["make[1]: Leaving directory '/builds/team/render/build'"]
    # `path:line:col` keeps it off the runner's `ERROR: Job failed: exit code 1`.
    - id: bazel
      role: wrapper
      classification: [any, build]
      description: >-
        Bazel reporting that an action or target failed. A wrapper — the compiler or test output it relays is the cause.
      pattern: '^ERROR: \S+:\d+:\d+: .*(failed|FAILED)|^FAILED: Build did NOT complete|^//\S+\s+FAILED in \d'
      before: 2
      after: 10
      examples:
        match: ['ERROR: /builds/team/svc/src/render/BUILD.bazel:12:11: Compiling src/render/shader.cc failed: (Exit 1): gcc failed']
        no_match: ['ERROR: Job failed: exit code 1', 'BUILD FAILED in 34s']

    # --- Containers, and the runner killing the job ------------------------
    - id: docker_build
      role: wrapper
      classification: [container, build]
      description: >-
        BuildKit giving up — `failed to solve` / `executor failed running` — around the Dockerfile step that failed. A wrapper: the `RUN` step's own output is the cause.
      pattern: 'failed to solve|executor failed running'
      before: 3
      after: 8
      examples:
        match: ['ERROR: failed to solve: process "/bin/sh -c cmake --build build --parallel 16" did not complete successfully: exit code: 137']
        no_match: ['#9 [builder 4/6] RUN cmake --build build --parallel 16']
    - id: oom
      role: tool
      classification: [any, infra]
      description: >-
        The job being killed — exit code 137, `Killed`, `Out of memory`. Nothing else in the log explains a SIGKILL.
      pattern: 'exit code 137|Killed|Out of memory'
      before: 5
      after: 2
      examples:
        match: ['#9 132.9 c++: fatal error: Killed signal terminated program cc1plus', 'ERROR: Job failed: exit code 137']
        no_match: ['ERROR: Job failed: exit code 1']

    # --- Infrastructure as code ----------------------------------------------
    - id: terraform
      role: tool
      classification: [iac]
      description: >-
        Terraform's boxed `│ Error:` and the `on main.tf line 12` it points at.
      pattern: '^\s*│\s*Error: |on .+\.tf line \d+'
      before: 1
      after: 12
      examples:
        match: ['│ Error: creating S3 Bucket (team-artifacts-prod): BucketAlreadyOwnedByYou']
        no_match: ['│ Warning: Argument is deprecated']

    # --- Fallback: a tool with no pack of its own --------------------------
    - id: generic_error
      role: fallback
      classification: [any]
      description: >-
        A line starting `ERROR` or `FATAL` from a tool with no pack of its own — the weakest signal; read it in context.
      pattern: '^(ERROR|FATAL)\b'
      before: 5
      after: 20
      examples:
        match: ['FATAL: custom tool reported a fatal problem']
        no_match: ['WARNING: custom tool is deprecated']

denoise:
  noise_patterns:
    - '^\s*$'
