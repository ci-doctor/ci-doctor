version: 2

# One grouped PR per ecosystem, rebased in place (limit 1). Spelled out per ecosystem:
# Dependabot handles YAML anchors poorly. `build(deps):` never cuts a release.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs/site
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
    groups:
      all:
        patterns: ["*"]
