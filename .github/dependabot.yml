version: 2

# One PR per ecosystem, not per package: a group collapses every update into a single
# `dependabot/<ecosystem>/…` branch, and Dependabot rebases that PR in place while it is
# open rather than opening another. The limit of 1 backs that up. Spelled out per
# ecosystem because Dependabot does not reliably support YAML anchors.
# prefix `build` + scope gives `build(deps):` — a Conventional Commit that cuts no release.

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /docs/site
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
    groups:
      all:
        patterns: ["*"]
