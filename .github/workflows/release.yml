name: release

# Every push to master with a feat/fix/BREAKING commit publishes the next alpha (0.0.1aN).
# The base version never moves; bumping it is a decision. See GUIDELINES.md §8.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # push the version-bump commit + tag, create/upload the Release
  id-token: write       # PyPI Trusted Publishing (OIDC) — no stored token needed
  attestations: write   # build provenance for the distributions and the image

# Workflow level so `if:` can test it. An absent secret skips the Docker push, not the release.
env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # zizmor: ignore[artipacked] — this job pushes the tag
        with:
          fetch-depth: 0          # full history: the gate reads every commit since the last tag

      # Docs, chores and refactors ride along in the next alpha instead of cutting one.
      - name: Is there anything to release?
        id: gate
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${last:+$last..}HEAD
          if git log "$range" --format='%s%n%b' \
             | grep -qE '^(feat|fix)(\(.+\))?!?:|^BREAKING CHANGE:'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No feat/fix/BREAKING commit since ${last:-the start of history} — nothing to release."
          fi

      # No cache: this job publishes, and a restored cache is writable by any branch's workflow.
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.gate.outputs.release == 'true'
        with:
          enable-cache: false

      # `uv version` keeps pyproject.toml and uv.lock in step; --no-sync skips an unused venv.
      - name: Bump to the next alpha
        id: bump
        if: steps.gate.outputs.release == 'true'
        run: |
          uv version --bump alpha --no-sync
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] is what stops this push from re-triggering the pipeline forever.
          git commit -am "chore(release): $VERSION [skip ci]"
          # Annotated tag, pushed by name: --follow-tags skips lightweight tags yet reports
          # success. --atomic makes a half-push impossible.
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/v$VERSION"

      - name: Build the distributions
        if: steps.gate.outputs.release == 'true'
        run: uv build

      - uses: docker/setup-buildx-action@v4
        if: steps.gate.outputs.release == 'true'

      - uses: docker/login-action@v4
        if: steps.gate.outputs.release == 'true' && env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One build: loaded for the air-gap tarball, pushed to Docker Hub unless the secret is absent.
      # Fully-qualified tags only: `push: true` pushes every tag, and a bare `ci-doctor:X`
      # resolves to docker.io/library/ci-doctor (no write access).
      - name: Build the Docker image
        id: push
        if: steps.gate.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            docker.io/fennet/ci-doctor:${{ steps.bump.outputs.version }}
            docker.io/fennet/ci-doctor:latest

      # The tarball is the air-gap path. The bare name is added locally so `docker load`
      # gives the `ci-doctor:X` the docs tell people to retag.
      - name: Save the Docker image as a gzipped tar
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          docker tag "docker.io/fennet/ci-doctor:$VERSION" "ci-doctor:$VERSION"
          docker save "ci-doctor:$VERSION" | gzip -9 > "ci-doctor-$VERSION-image.tar.gz"

      # JSON Schema for .ci-doctor.yml, generated from the pydantic model. Editors resolve it
      # via its $id, which points at /releases/latest/download/ci-doctor.schema.json.
      - name: Generate the config JSON Schema
        if: steps.gate.outputs.release == 'true'
        run: uv run ci-doctor config --schema > ci-doctor.schema.json

      # Runtime deps only: an SBOM should describe what a user installs, not our tooling.
      - name: Generate the SBOM
        if: steps.gate.outputs.release == 'true'
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements requirements.txt -o ci-doctor.sbom.json

      - uses: actions/attest-build-provenance@v4
        if: steps.gate.outputs.release == 'true'
        with:
          subject-path: dist/*

      - uses: actions/attest-build-provenance@v4
        if: steps.push.outcome == 'success' && env.DOCKERHUB_USERNAME != ''
        with:
          subject-name: docker.io/fennet/ci-doctor
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Not `--prerelease`: /releases/latest skips prereleases and the schema $id depends on it.
      # While every release is an alpha, flagging them would break that URL.
      - name: Create the GitHub Release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            dist/* "ci-doctor-$VERSION-image.tar.gz" ci-doctor.schema.json ci-doctor.sbom.json

      # Trusted Publishing: authenticates via OIDC (id-token: write above). No token/secret.
      # Requires a matching publisher on PyPI (repo fennet82/ci-doctor, workflow release.yml).
      - name: Publish distributions to PyPI
        if: steps.gate.outputs.release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
