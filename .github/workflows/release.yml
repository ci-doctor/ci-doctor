name: release

# Every push to master with a feat/fix/BREAKING commit publishes the next alpha (0.0.1aN).
# The base version never moves; bumping it is a decision. See GUIDELINES.md §8.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # create the GitHub Release and upload its assets
  id-token: write       # PyPI Trusted Publishing (OIDC) — no stored token needed
  attestations: write   # build provenance for the distributions and the image

# Workflow level so `if:` can test it. An absent secret skips the Docker push, not the release.
env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0               # the gate reads every commit since the last tag
          persist-credentials: false   # the push authenticates as the release App

      # Docs, chores and refactors ride along in the next alpha instead of cutting one.
      - name: Is there anything to release?
        id: gate
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          range=${last:+$last..}HEAD
          if git log "$range" --format='%s%n%b' \
             | grep -qE '^(feat|fix)(\(.+\))?!?:|^BREAKING CHANGE:'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "No feat/fix/BREAKING commit since ${last:-the start of history} — nothing to release."
          fi

      # No cache: this job publishes, and a restored cache is writable by any branch's workflow.
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.gate.outputs.release == 'true'
        with:
          enable-cache: false

      # Working tree only: nothing is committed until everything below has built.
      - name: Bump to the next alpha
        id: bump
        if: steps.gate.outputs.release == 'true'
        run: |
          uv version --bump alpha --no-sync
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Build the distributions
        if: steps.gate.outputs.release == 'true'
        run: uv build

      - uses: docker/setup-buildx-action@v4
        if: steps.gate.outputs.release == 'true'

      # Loaded, not pushed: a Dockerfile error must fail here, before the tag exists.
      # Fully-qualified tags: a bare `ci-doctor:X` resolves to docker.io/library/ci-doctor.
      - name: Build the Docker image
        if: steps.gate.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            docker.io/fennet/ci-doctor:${{ steps.bump.outputs.version }}
            docker.io/fennet/ci-doctor:latest

      # The air-gap path. The bare name is added so `docker load` gives the `ci-doctor:X`
      # the docs tell people to retag.
      - name: Save the Docker image as a gzipped tar
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          docker tag "docker.io/fennet/ci-doctor:$VERSION" "ci-doctor:$VERSION"
          docker save "ci-doctor:$VERSION" | gzip -9 > "ci-doctor-$VERSION-image.tar.gz"

      # Editors resolve it via its $id, /releases/latest/download/ci-doctor.schema.json.
      - name: Generate the config JSON Schema
        if: steps.gate.outputs.release == 'true'
        run: uv run ci-doctor config --schema > ci-doctor.schema.json

      # Runtime deps only: an SBOM should describe what a user installs, not our tooling.
      - name: Generate the SBOM
        if: steps.gate.outputs.release == 'true'
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements requirements.txt -o ci-doctor.sbom.json

      # master and v* tags are behind rulesets; this App is the one actor allowed through.
      - uses: actions/create-github-app-token@v3
        id: app
        if: steps.gate.outputs.release == 'true'
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write   # the push and the tag; nothing else the App could grant

      - name: Commit and tag
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] is what stops this push from re-triggering the pipeline forever.
          git commit -am "chore(release): $VERSION [skip ci]"
          # Annotated tag pushed by name, --atomic: never a bump without its tag or vice versa.
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:$GITHUB_REF_NAME" "refs/tags/v$VERSION"

      - uses: docker/login-action@v4
        if: steps.gate.outputs.release == 'true' && env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same builder, same context: every layer comes from the build above.
      - name: Push the Docker image
        id: push
        if: steps.gate.outputs.release == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            docker.io/fennet/ci-doctor:${{ steps.bump.outputs.version }}
            docker.io/fennet/ci-doctor:latest

      - uses: actions/attest-build-provenance@v4
        if: steps.gate.outputs.release == 'true'
        with:
          subject-path: dist/*

      - uses: actions/attest-build-provenance@v4
        if: steps.push.outcome == 'success'
        with:
          subject-name: docker.io/fennet/ci-doctor
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Not `--prerelease`: /releases/latest skips prereleases and the schema $id depends on it.
      - name: Create the GitHub Release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            dist/* "ci-doctor-$VERSION-image.tar.gz" ci-doctor.schema.json ci-doctor.sbom.json

      # Trusted Publishing over OIDC; the PyPI publisher is bound to this repo and release.yml.
      - name: Publish distributions to PyPI
        if: steps.gate.outputs.release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
