name: release gate

# Every PR: the packaging release.yml will do, minus publishing and Docker. release.yml
# builds everything before it pushes the tag; this finds the break on the PR that caused it.
on:
  pull_request:
    branches: [master]

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  distributions:
    name: sdist + wheel build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv build
      # Catches metadata PyPI rejects on upload (bad README render, malformed classifier).
      - run: uvx twine check dist/*

  schema:
    name: config schema generates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      # The release attaches this and editors resolve it via its $id: prove it still parses.
      - run: uv run ci-doctor config --schema | python3 -c 'import json,sys; json.load(sys.stdin)'

  sbom:
    name: SBOM generates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
      - run: uvx --from cyclonedx-bom cyclonedx-py requirements requirements.txt -o sbom.json
      - run: python3 -c 'import json; json.load(open("sbom.json"))'
