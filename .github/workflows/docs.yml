name: docs

# Publishes docs/site to GitHub Pages; PRs only build it (ci.yml). Runs after release.yml,
# not on push: the site reads its version from pyproject.toml, which release bumps mid-run.
# release.yml completes on every master push, so docs-only pushes still land here.
on:
  # zizmor: ignore[dangerous-triggers] — release runs only on pushes to master (no forks),
  # and the checkout pins master.
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Queue deploys; never cancel a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Don't advertise a version whose release failed. workflow_dispatch is the retry.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # job-level blocks replace the workflow-level one, so restate it
      pages: write     # configure-pages reads the site config
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master   # the tip, i.e. the bump commit
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
