name: ci

# Jobs are independent: one red check names the kind of problem; `all-green` is the one
# the ruleset requires. Pushes to master re-check the merge result ("up to date" is off)
# and are Sonar's baseline.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # which versions break is the useful answer, not just that one did
      matrix:
        # Kept in step with the pyproject classifiers by tests/test_python_versions.py.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # Every extra that can coexist (all but `litellm`, which conflicts with `openai`),
      # so the tests that build each real provider run instead of skipping.
      - run: >-
          uv sync --extra openai --extra anthropic --extra bedrock --extra bedrock-mantle
          --extra google --extra groq --extra mistral --extra cohere --extra xai --extra huggingface
      # Failures annotate the diff via the pytest-github-actions-annotate-failures dev dep.
      - run: uv run pytest -q --cov
      # One leg is enough for Sonar; the floor above is what gates coverage.
      - name: Coverage report for Sonar
        if: matrix.python-version == '3.11'
        run: uv run coverage xml
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1
      # Informational: the pytest step already gates the coverage floor.
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage — Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY" || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: ruff check
        run: uv run ruff check ci_doctor tests
      - name: ruff format
        run: uv run ruff format --check ci_doctor tests
      # --preview only for *.md: it formats Python blocks inside docs, not prose.
      - name: ruff format (markdown code blocks)
        run: uv run ruff format --preview --check $(git ls-files '*.md' ':!:.claude/**')
      # ci_doctor only: a type error in the shipped package is what reaches a user.
      - name: ty
        run: uv run ty check ci_doctor

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      # Build only — publishing is docs.yml, so a PR cannot touch what is live.
      - run: npm run build

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the PR's whole history, not just the tip
          persist-credentials: false
      # The CLI, not gitleaks-action: the action needs a licence secret for an org, and fork
      # and Dependabot PRs get no secrets. Pinned by checksum; bump both lines together.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml'

  # Fork and Dependabot PRs get no secrets: every step skips and the job still succeeds,
  # so a PR is never blocked on a token it cannot have.
  sonar:
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0   # Sonar uses blame to decide what is new code
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage-xml
      # No cache: this job holds a token, and a restored cache is writable by any branch.
      - uses: astral-sh/setup-uv@v10.2.0
        if: env.SONAR_TOKEN != ''
        with:
          enable-cache: false
      # Configured by [tool.sonar] in pyproject.toml; the token comes from SONAR_TOKEN.
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        run: uvx pysonar==1.9.0.5762

  # `always()`: a failed or cancelled job must turn this red, not leave it pending.
  all-green:
    if: always()
    needs: [test, lint, docs, leaks, sonar]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
