name: ci

# `all-green` is the one check the ruleset requires. Master pushes re-check the merged
# result ("up to date" is off) and give Sonar its baseline.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # report every version that breaks
      matrix:
        # Kept in step with the pyproject classifiers by tests/test_python_versions.py.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # Every extra that can coexist (litellm conflicts with openai), so provider tests run.
      - run: >-
          uv sync --extra openai --extra anthropic --extra bedrock --extra bedrock-mantle
          --extra google --extra groq --extra mistral --extra cohere --extra xai --extra huggingface
      - run: uv run pytest -q --cov
      # One leg is enough for Sonar.
      - name: Coverage report for Sonar
        if: matrix.python-version == '3.11'
        run: .venv/bin/coverage xml   # the synced venv: nothing resolves or builds here
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 1
      # Informational; pytest gates the floor.
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage — Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY" || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: ruff check
        run: uv run ruff check ci_doctor tests
      - name: ruff format
        run: uv run ruff format --check ci_doctor tests
      # --preview only for *.md: it formats Python blocks inside docs, not prose.
      - name: ruff format (markdown code blocks)
        run: uv run ruff format --preview --check $(git ls-files '*.md' ':!:.claude/**')
      # ci_doctor only: a type error in the shipped package is what reaches a user.
      - name: ty
        run: uv run ty check ci_doctor

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      # Build only; docs.yml publishes.
      - run: npm run build

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the PR's whole history, not just the tip
          persist-credentials: false
      # Organisations need a licence key; it is an org secret, so it must be passed in.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Fork PRs get no secrets, so they skip the job (a job-level `if` cannot read `secrets`).
  sonar:
    if: ${{ !github.event.pull_request.head.repo.fork }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Sonar uses blame to decide what is new code
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage-xml
      # Configured by sonar-project.properties.
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # `always()`: a failed or cancelled job must turn this red, not leave it pending.
  # Skipped passes: only a fork's `sonar` skips on its own; any other skip follows a failure.
  all-green:
    if: always()
    needs: [test, lint, docs, leaks, sonar]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
