name: ci

# Jobs are independent on purpose: one red check should name the kind of problem.
#
# Runs on every hop — <type>/<slug> -> development -> master, and hotfix/<slug> ->
# master — plus pushes to either branch, so a merge that skipped a PR is still
# checked. Security scanning is security.yml; release readiness is release-gate.yml.
on:
  pull_request:
    branches: [development, master]
  push:
    branches: [development, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The git hooks check both of these locally, and `--no-verify` skips them. The
  # release gate reads commit types to decide whether to ship, so they are worth
  # asserting somewhere that cannot be bypassed.
  conventions:
    permissions:
      contents: read
      pull-requests: read   # commitlint lists the PR's commits through the API
    # Feature work and hotfixes. The development -> master PR is an integration,
    # not a feature branch, and carries no type prefix.
    if: >-
      github.event_name == 'pull_request' &&
      (github.base_ref == 'development' || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the PR's own commits, not just its tip
          persist-credentials: false
      - name: Branch name is <type>/<slug>
        env:
          BRANCH: ${{ github.head_ref }}   # via env, never interpolated into the script
        run: |
          types='feat|fix|docs|test|chore|refactor|perf|ci|build|style|revert|hotfix'
          # Dependabot names its own branches (dependabot/github_actions/…).
          [[ "$BRANCH" == dependabot/* ]] && { echo "branch '$BRANCH' ok (dependabot)"; exit 0; }
          if [[ ! "$BRANCH" =~ ^($types)/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "::error::branch '$BRANCH' is not <type>/<slug>. Types: ${types//|/, }"
            exit 1
          fi
          echo "branch '$BRANCH' ok"
      - uses: wagoid/commitlint-github-action@v6
        with:
          # Not the body: generated bodies (changelogs, trailers) have long lines.
          configFile: .commitlintrc.yml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # which versions break is the useful answer, not just that one did
      matrix:
        # Kept in step with the pyproject classifiers by tests/test_python_versions.py.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      # Failures annotate the diff inline: the pytest-github-actions-annotate-failures
      # dev dependency emits GitHub's ::error commands, so there is no step for it here.
      - run: uv run pytest -q --cov
      # $GITHUB_STEP_SUMMARY is markdown rendered on the run page — GitHub's answer to
      # GitLab's report artifacts. Informational only: pytest already gated the floor.
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage — Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY" || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: ruff check
        run: uv run ruff check ci_doctor tests
      - name: ruff format
        run: uv run ruff format --check ci_doctor tests
      # --preview is scoped to *.md so Python stays on ruff's stable rules. It
      # reformats Python blocks inside docs, not prose.
      - name: ruff format (markdown code blocks)
        run: uv run ruff format --preview --check $(git ls-files '*.md' ':!:.claude/**')
      # ci_doctor only: a type error in the shipped package is what reaches a user.
      - name: ty
        run: uv run ty check ci_doctor

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      # Build only — publishing is docs.yml, so a PR cannot touch what is live.
      - run: npm run build

  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the PR's whole history, not just the tip
          persist-credentials: false
      # Organisations need a licence key; it is an org secret, so it must be passed in.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
