name: backmerge

# Syncs development with master after release.yml commits the version bump (hotfixes too).
# Opens the PR once ci, security, release and docs are all green for the latest master
# release; the last one to finish does it. workflow_run only fires from the default branch.
on:
  # zizmor: ignore[dangerous-triggers] — checks out nothing, runs no PR code; API reads only.
  workflow_run:
    workflows: [ci, security, release, docs]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: backmerge
  cancel-in-progress: false

jobs:
  backmerge:
    # docs is stamped with the default branch, not master, so it can't be filtered on branch.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.name == 'docs')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read         # list the other pipelines' runs
      pull-requests: write  # open the back-merge PR
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The latest master release is the anchor: its commit, and when it finished.
          release=$(gh run list --workflow release --branch master --limit 1 \
            --json headSha,status,conclusion,updatedAt --jq '.[0]')
          if [[ "$(jq -r '"\(.status)/\(.conclusion)"' <<<"$release")" != "completed/success" ]]; then
            echo "latest master release is not a finished success — nothing to do"
            exit 0
          fi
          sha=$(jq -r .headSha <<<"$release")
          released=$(jq -r .updatedAt <<<"$release")

          for wf in ci security; do
            result=$(gh run list --workflow "$wf" --branch master --commit "$sha" --limit 1 \
              --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"')
            if [[ "$result" != "completed/success" ]]; then
              echo "$wf is $result for $sha — not all green yet, nothing to do"
              exit 0
            fi
          done

          # A workflow_run run carries the default branch's commit, so docs is matched by
          # time instead: the latest run must have started after the release finished.
          docs=$(gh run list --workflow docs --limit 1 \
            --json status,conclusion,createdAt --jq '.[0] | "\(.status)/\(.conclusion) \(.createdAt)"')
          if [[ "${docs%% *}" != "completed/success" || "${docs##* }" < "$released" ]]; then
            echo "docs has not succeeded since the release ($docs) — nothing to do"
            exit 0
          fi

          ahead=$(gh api "repos/$GH_REPO/compare/development...master" --jq .ahead_by)
          if [[ "$ahead" -eq 0 ]]; then
            echo "development already contains master"
            exit 0
          fi

          if [[ -n "$(gh pr list --base development --head master --state open --json number --jq '.[]')" ]]; then
            echo "back-merge PR already open"
            exit 0
          fi

          body=$(cat <<'EOF'
          Syncs development with master after a release. The release workflow commits the version bump (`pyproject.toml`, `uv.lock`) and tag straight to master, so development shows the previous version until this lands. A hotfix, which skips development, is carried back by the same PR.

          ci, security, release and docs have all passed on master. Merge with a **merge commit**, not a squash: a squash leaves development behind master again.
          EOF
          )

          # --head master, not a snapshot branch: the PR tracks the tip as master moves.
          gh pr create --base development --head master \
            --title "chore: back-merge master into development" \
            --body "$body"
