name: backmerge

# Syncs development with master after release.yml commits the version bump (hotfixes too).
# Opens the PR once ci, security, release and docs are all green for the commit; the last
# one to finish does it. workflow_run only fires from the default branch's copy.
on:
  # zizmor: ignore[dangerous-triggers] — checks out nothing, runs no PR code; API reads only.
  workflow_run:
    workflows: [ci, security, release, docs]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: backmerge
  cancel-in-progress: false

jobs:
  backmerge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read         # list the other pipelines' runs for this commit
      pull-requests: write  # open the back-merge PR
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # The commit the pipelines ran on, not the tip: the bump commit is [skip ci].
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          for wf in ci security release docs; do
            result=$(gh run list --workflow "$wf" --branch master --commit "$SHA" --limit 1 \
              --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"')
            if [[ "$result" != "completed/success" ]]; then
              echo "$wf is $result for $SHA — not all green yet, nothing to do"
              exit 0
            fi
          done

          ahead=$(gh api "repos/$GH_REPO/compare/development...master" --jq .ahead_by)
          if [[ "$ahead" -eq 0 ]]; then
            echo "development already contains master"
            exit 0
          fi

          if [[ -n "$(gh pr list --base development --head master --state open --json number --jq '.[]')" ]]; then
            echo "back-merge PR already open"
            exit 0
          fi

          body=$(cat <<'EOF'
          Syncs development with master after a release. The release workflow commits the version bump (`pyproject.toml`, `uv.lock`) and tag straight to master, so development shows the previous version until this lands. A hotfix, which skips development, is carried back by the same PR.

          ci, security, release and docs have all passed on master. Merge with a **merge commit**, not a squash: a squash leaves development behind master again.
          EOF
          )

          # --head master, not a snapshot branch: the PR tracks the tip as master moves.
          gh pr create --base development --head master \
            --title "chore: back-merge master into development" \
            --body "$body"
