name: backmerge

# A hotfix reaches master without passing through development, so development ends
# up missing it and the next integration silently reverts the fix. This opens the
# master -> development PR, but only once everything that runs on master has passed
# for the hotfix's merge commit: ci, security, release, docs. A back-merge of a hotfix
# that then failed to ship would hand development a fix master has not released.
#
# Only hotfixes: a normal development -> master merge also leaves master ahead, so a
# plain "is master ahead" check would fire on every release.
#
# Each of the four finishing wakes this up; all but the last find a pipeline still
# running (or failed) and stop. The last one finds them all green and opens the PR.
# Note workflow_run only fires from the file on the default branch (development).
on:
  # zizmor: ignore[dangerous-triggers] — checks out nothing and runs no PR code: it reads
  # run conclusions and the merged PR's branch name through the API, and the branch name
  # reaches the script through env, never the script text.
  workflow_run:
    workflows: [ci, security, release, docs]
    types: [completed]
    branches: [master]

permissions:
  contents: read

# The four finish minutes apart, but a re-run can land two at once; queue so the
# second sees the PR the first opened.
concurrency:
  group: backmerge
  cancel-in-progress: false

jobs:
  backmerge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read         # list the other pipelines' runs for this commit
      pull-requests: write  # open the back-merge PR
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # The merge commit the pipelines ran on, not the tip: release pushes a bump
          # commit after it, and that one carries [skip ci] so it has no runs at all.
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          for wf in ci security release docs; do
            result=$(gh run list --workflow "$wf" --branch master --commit "$SHA" --limit 1 \
              --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion)"')
            if [[ "$result" != "completed/success" ]]; then
              echo "$wf is $result for $SHA — not all green yet, nothing to do"
              exit 0
            fi
          done

          hotfix=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq \
            '[.[] | select(.merged_at != null and .base.ref == "master" and (.head.ref | startswith("hotfix/")))] | .[0].head.ref // empty')
          if [[ -z "$hotfix" ]]; then
            echo "$SHA did not come from a hotfix/ PR — nothing to back-merge"
            exit 0
          fi

          ahead=$(gh api "repos/$GH_REPO/compare/development...master" --jq .ahead_by)
          if [[ "$ahead" -eq 0 ]]; then
            echo "development already contains master"
            exit 0
          fi

          if [[ -n "$(gh pr list --base development --head master --state open --json number --jq '.[]')" ]]; then
            echo "back-merge PR already open"
            exit 0
          fi

          # --head master, not a snapshot branch, so the PR tracks the tip as master moves.
          gh pr create --base development --head master \
            --title "chore: back-merge master into development" \
            --body "$(printf '`%s` shipped straight to master and passed ci, security, release and docs. Merge this so development does not revert it.' "$hotfix")"
