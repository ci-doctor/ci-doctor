name: security

# Separate from ci.yml for the schedule: a CVE is published after the last commit,
# so without a weekly run it would only surface on whatever PR comes next.
on:
  pull_request:
    branches: [development, master]
  push:
    branches: [development, master]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: code scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  deps:
    name: dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      # Runtime deps only — dev tooling is not what a user installs.
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
      - run: uvx pip-audit -r requirements.txt

  actions:
    name: workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uvx zizmor --config .github/zizmor.yml .github/workflows
