name: Feature request
description: Suggest something ci-doctor should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds, or other approaches you considered.
  - type: markdown
    attributes:
      value: |
        Out of scope: anything that writes to CI, or changes a pipeline's outcome.
