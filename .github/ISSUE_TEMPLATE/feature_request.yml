name: Feature request
description: Suggest something ci-doctor should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: "How it could work: a command, a config key, an output, whatever you have in mind."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other approaches you considered.
  - type: markdown
    attributes:
      value: |
        ci-doctor is a read-only postmortem: it never retries, cancels or pushes anything,
        and it never changes a pipeline's outcome. Requests that would break that are out of scope.
