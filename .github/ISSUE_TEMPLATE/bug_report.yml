name: Bug report
description: ci-doctor crashed, errored, or did something it shouldn't.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If the problem is a **wrong diagnosis** (blamed the wrong step,
        missed the real error), use the "Wrong diagnosis" template instead.

        **Logs and configs can hold secrets.** Redact tokens, hostnames and anything private before pasting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        I ran `ci-doctor analyze 12345` and expected …, but got …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest steps that show it. A replayable job log (`ci-doctor analyze job.log`) is ideal.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output with `-v`
      description: The full output of the failing command, run with `ci-doctor -v …` for debug logs.
      render: text
  - type: textarea
    id: report
    attributes:
      label: "`ci-doctor report`"
      description: |
        Versions, platform, a config summary and which CA/proxy variables are set. Run it with the
        same `-f` files as the failing command. It prints no secrets: variables show as set or unset.
      render: text
    validations:
      required: true
