name: Documentation
description: Something in the docs is wrong, missing or unclear.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The docs.cidoc.dev URL, or the file in the repo (README, GUIDELINES …).
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing
      description: Quote the part that's off, and say what you expected to find.
    validations:
      required: true
