# Read by sonarqube-scan-action in ci.yml (Automatic Analysis is off: it cannot import coverage).
# Whole repo as source, so secret and workflow/Dockerfile rules see it; coverage is ci_doctor's.
sonar.organization=ci-doctor
sonar.projectKey=ci-doctor_ci-doctor
sonar.sources=.
sonar.exclusions=tests/**
sonar.tests=tests
sonar.coverage.exclusions=docs/**,scripts/**,.githooks/**
sonar.python.coverage.reportPaths=coverage.xml

sonar.issue.ignore.multicriteria=sha,nobuild,nobuilddocker,unpinned,root

# Actions are pinned to tags, not SHAs: same policy as .github/zizmor.yml.
sonar.issue.ignore.multicriteria.sha.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.sha.resourceKey=.github/workflows/**

# `uv sync/run --no-build` can't install our own package; every dependency in uv.lock ships wheels.
sonar.issue.ignore.multicriteria.nobuild.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.nobuild.resourceKey=.github/workflows/**
# Same in the Dockerfile: the dependency step passes --no-build, the project step can't.
sonar.issue.ignore.multicriteria.nobuilddocker.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.nobuilddocker.resourceKey=Dockerfile

# CI tools run via `uvx` at their latest release; project deps are `uv sync/run --locked`.
sonar.issue.ignore.multicriteria.unpinned.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.unpinned.resourceKey=.github/workflows/**

# Image runs as root on purpose: GitLab jobs and `docker run -v "$PWD:/app"` write to host-owned mounts.
sonar.issue.ignore.multicriteria.root.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.root.resourceKey=Dockerfile
