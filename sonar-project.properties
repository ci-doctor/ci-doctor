# Read by sonarqube-scan-action in ci.yml (Automatic Analysis is off: it cannot import coverage).
# Whole repo as source, so secret and workflow/Dockerfile rules see it; coverage is ci_doctor's.
sonar.organization=ci-doctor
sonar.projectKey=ci-doctor_ci-doctor
sonar.sources=.
sonar.exclusions=tests/**
sonar.tests=tests
sonar.coverage.exclusions=docs/**,scripts/**,.githooks/**
sonar.python.coverage.reportPaths=coverage.xml

# Actions are pinned to tags, not SHAs: same policy as .github/zizmor.yml.
sonar.issue.ignore.multicriteria=sha
sonar.issue.ignore.multicriteria.sha.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.sha.resourceKey=.github/workflows/**
